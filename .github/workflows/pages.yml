# Publishes the dashboard (dashboard/) to GitHub Pages on every push to main that touches it.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Publish dashboard

on:
  push:
    branches: [main]
    paths: ['dashboard/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the site (the dashboard without its build tools)
        run: |
          mkdir _site
          cp -r dashboard/. _site/
          rm -rf _site/tools _site/vercel.json _site/.vercelignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
